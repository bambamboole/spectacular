laravel: '@testbench'

providers:
  - Dedoc\Scramble\ScrambleServiceProvider
  - Spatie\QueryBuilder\QueryBuilderServiceProvider
  - Bambamboole\Spectacular\SpectacularServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  welcome: false
  install: true
  discovers:
    web: true
    api: true
    commands: false
    components: false
    views: true
  build:
    - create-sqlite-db
    - migrate:fresh:
        --force: true
